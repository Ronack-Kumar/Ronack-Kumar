<svg xmlns="http://www.w3.org/2000/svg" width="440" height="276" viewBox="0 0 440 276" role="img" aria-labelledby="title desc"><title id="title">Engineering metrics</title><desc id="desc">GRID07: 84% held-out routing accuracy in my benchmark, six provider integrations, and 84 backend tests. OfferSafe: 19 weighted risk signals.</desc><style>.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><defs>
      <linearGradient id="name" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#be572e"/><stop offset="1" stop-color="#b94a3e"/></linearGradient>
