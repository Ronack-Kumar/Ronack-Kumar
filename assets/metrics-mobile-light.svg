      <radialGradient id="warm"><stop stop-color="#b94a3e" stop-opacity=".14"/><stop offset="1" stop-color="#b94a3e" stop-opacity="0"/></radialGradient>
      <radialGradient id="aura"><stop stop-color="#7042b3" stop-opacity=".2"/><stop offset="1" stop-color="#7042b3" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#423b51" opacity=".045"/></pattern>
