<svg xmlns="http://www.w3.org/2000/svg" width="440" height="570" viewBox="0 0 440 570" role="img" aria-labelledby="title desc"><title id="title">GRID07 routing overview</title><desc id="desc">A question, conversation context, and available model catalog inform GRID07. It selects an expert persona, executes an LLM request, and saves the trace.</desc><style>.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><defs>
