<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" role="img" aria-labelledby="title desc"><title id="title">GRID07 routing overview</title><desc id="desc">A question, conversation context, and available model catalog inform GRID07. It selects an expert persona, executes an LLM request, and saves the trace.</desc><style>.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><defs>
